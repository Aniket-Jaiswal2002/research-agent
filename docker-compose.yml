version: '3.8'

services:
  # ── Backend — FastAPI ───────────────────────────────────────────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vector_store:/app/vector_store
    restart: unless-stopped

  # ── Frontend — React ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    